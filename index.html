<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema CAS - Portal de Pedidos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: #ffffff;
            padding: 30px;
            margin: 40px auto;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .previa-calculo {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #1e293b;
        }
        .previa-calculo p {
            margin: 5px 0;
        }
        .btn-enviar {
            width: 100%;
            background-color: #1e3a8a;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-enviar:hover {
            background-color: #172554;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Sistema CAS - Portal de Pedidos</h2>

        <form id="formSolicitudCAS" action="recepcion.html" method="GET">
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej. Carlos Quispe">
            </div>

            <div class="form-group">
                <label for="tipoDoc">Tipo de Documento</label>
                <select id="tipoDoc" name="tipoDoc" required>
                    <option value="DNI">DNI</option>
                    <option value="CE">Carné de Extranjería</option>
                    <option value="RUC">RUC</option>
                </select>
            </div>

            <div class="form-group">
                <label for="numeroDoc">Número de Documento</label>
                <input type="text" id="numeroDoc" name="numeroDoc" required placeholder="Ej. 45678912">
            </div>

            <div class="form-group">
                <label for="monto">Monto a Solicitar (S/)</label>
                <input type="number" id="monto" name="monto" step="0.01" min="1" required placeholder="Ej. 50">
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono / WhatsApp</label>
                <input type="tel" id="telefono" name="telefono" required placeholder="Ej. 987654321">
            </div>

            <div class="previa-calculo" id="previaCalculo">
                <p><strong>Interés (9%):</strong> S/ 0.00</p>
                <p><strong>Total Estimado a Pagar:</strong> S/ 0.00</p>
            </div>

            <button type="submit" class="btn-enviar">Enviar Solicitud</button>
        </form>
    </div>

    <script>
        const TASA = 0.09;
        const inputMonto = document.getElementById('monto');
        const previa = document.getElementById('previaCalculo');

        function actualizarPrevia() {
            const val = parseFloat(inputMonto.value);
            if (!isNaN(val) && val > 0) {
                const interes = val * TASA;
                const total = val + interes;
                previa.innerHTML = `
                    <p><strong>Interés (9%):</strong> S/ ${interes.toFixed(2)}</p>
                    <p><strong>Total Estimado a Pagar:</strong> S/ ${total.toFixed(2)}</p>
                `;
            } else {
                previa.innerHTML = `
                    <p><strong>Interés (9%):</strong> S/ 0.00</p>
                    <p><strong>Total Estimado a Pagar:</strong> S/ 0.00</p>
                `;
            }
        }

        inputMonto.addEventListener('input', actualizarPrevia);
    </script>
</body>
</html>
